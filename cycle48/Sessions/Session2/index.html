<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session2</title>
</head>
<body>

    <!-- the way to get data from user to store database  is input 
     1-server===>name,value
     2-UI===>for,id
     3-Question type====>type
    -->

    <form action="" method="">

        <!-- user name -->
         <label for="username">User Name:</label>
         <input id="username" type="text" name="username">
         <br><hr><br>

         <!-- user Age -->
         <label for="userAge">User Age:</label>
         <input id="userAge" type="number" max="50" min="18" name="userAge">
         <br><hr><br>

        <!-- user name -->
         <label for="userEmail">User Email:</label>
         <input id="userEmail" type="email" name="userEmail">
         <br><hr><br>
         
        <!-- user password -->
         <label for="password">User Name:</label>
         <input id="password" type="password" name="password">
         <br><hr><br>

        <!-- LinkedIn -->
         <label for="LinkedIn ">User Name:</label>
         <input id="LinkedIn " type="url" name="LinkedIn">
         <br><hr><br>


         <!--user telephone -->
         <label for="number ">User phone:</label>
         <input id="number " type="tel" name="number">
         <br><hr><br>

    

         <button type="submit">submit</button>
        

    </form>

</body>
</html>
